<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Happy Truck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=121">
<link rel="stylesheet" href="control.css?v=121">
<link rel="stylesheet" href="daily.css?v=121">
<link rel="stylesheet" href="trips.css?v=121">
<title>Happy Truck · Drives</title>
</head>
<body>
<div id="lock" class="lock hidden">
  <div class="lockbox">
    <div class="logo"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 2.8 5 13.6h6.2l-1 7.6 8.3-10.9h-6.3z"/></svg></div>
    <h1>Happy Truck</h1>
    <p>Enter your passcode once. It stays on this device.</p>
    <form id="lockform"><input id="pass" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx"><button>Unlock</button></form>
    <div id="lockerr" class="err"></div>
  </div>
</div>
<div id="app" class="hidden">
  <header>
    <div id="topseg" class="seg dr-viewseg topseg hidden" role="tablist" aria-label="View"></div>
    <div class="seg" id="seg">
      <button data-v="day">Day</button><button data-v="week">Week</button><button data-v="month">Month</button><button data-v="year">Year</button>
    </div>
    <div id="reporthead" class="reporthead hidden">
      <div class="rpt-hblock">
        <div class="rpt-htitle">Automotive Tech Weekly Report</div>
        <div id="rptorigin" class="rpt-origin"></div>
      </div>
      <button type="button" id="rptarchive" class="pill rpt-archive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4.5h16a1.2 1.2 0 0 1 1.2 1.2V8H2.8V5.7A1.2 1.2 0 0 1 4 4.5zm.8 5.3h14.4v8.5A1.7 1.7 0 0 1 17.5 20h-11A1.7 1.7 0 0 1 4.8 18.3zM9 12.2h6v1.8H9z"/></svg>
        Archive
      </button>
    </div>
    <div id="rviewseg" class="seg dr-viewseg" role="tablist" aria-label="Report view">
      <button type="button" data-rview="summary" role="tab">Summary</button><button type="button" data-rview="reports" role="tab">Team Daily Reports</button>
    </div>
    <div id="dailyhead" class="reporthead dailyhead hidden">
      <button type="button" id="dailyback" class="auto-back dr-back hidden" aria-label="Back to Summary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg>
      </button>
      <div class="rpt-hblock">
        <div id="dailytitle" class="rpt-htitle">Team Daily Reports</div>
        <div id="dailysub" class="rpt-origin"></div>
      </div>
      <button type="button" id="dailyarchive" class="pill rpt-archive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4.5h16a1.2 1.2 0 0 1 1.2 1.2V8H2.8V5.7A1.2 1.2 0 0 1 4 4.5zm.8 5.3h14.4v8.5A1.7 1.7 0 0 1 17.5 20h-11A1.7 1.7 0 0 1 4.8 18.3zM9 12.2h6v1.8H9z"/></svg>
        Archive
      </button>
    </div>
    <div class="toprow">
      <div id="efilter" class="efilter hidden" role="group" aria-label="Filter the energy list">
        <button type="button" data-ef="all" class="on" aria-pressed="true" aria-label="All" title="All"></button><button type="button" data-ef="charge" aria-pressed="false" aria-label="Charger" title="Charger"></button><button type="button" data-ef="trip" aria-pressed="false" aria-label="Trip" title="Trip"></button><button type="button" data-ef="station" class="hidden" aria-pressed="false" aria-label="DC fast charging stations" title="Fast charging"></button>
      </div>
      <div class="daterow">
        <button id="prev" class="nav" aria-label="Previous"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg></button>
        <div id="title" class="title"></div>
        <button id="next" class="nav" aria-label="Next"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <button id="today" class="pill">Today</button>
    </div>
    <div id="rptsrcrow" class="rpt-srcrow hidden" hidden>
      <div class="rp-seg rpt-srcseg" role="tablist" aria-label="Report source">
        <button type="button" data-source="cio">Grok</button>
        <button type="button" data-source="chatgpt">ChatGPT</button>
      </div>
    </div>
    <div id="autohead" class="autohead hidden">
      <button type="button" id="autoback" class="auto-back hidden" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg>
      </button>
      <div id="autotitle" class="auto-htitle">Automations</div>
    </div>
    <div id="ctlhead" class="ctlhead hidden">
      <button type="button" id="ctlback" class="auto-back hidden" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg>
      </button>
      <div id="ctltitle" class="auto-htitle">Vehicle Control</div>
    </div>
  </header>
  <div id="statcard" class="statcard glow glow-indigo"><section id="summary" class="summary"></section></div>
  <main id="main"></main>
  <footer id="foot"></footer>
  <nav id="tabbar" class="tabbar tabs-4 tabs-5" role="tablist" aria-label="Saving, Control, Trips, News, or Report">
    <button type="button" data-mode="saving" role="tab" aria-selected="true" aria-label="Saving and Energy">
      <span class="tab-ico tab-save" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M14.6 9.3c-.4-.9-1.4-1.5-2.6-1.5-1.5 0-2.6.8-2.6 1.9 0 2.7 5.4 1.4 5.4 4.3 0 1.2-1.2 2.1-2.8 2.1-1.3 0-2.4-.6-2.8-1.6M12 6.4v1.4M12 16.1v1.5"/></svg></span>
      <span class="tab-lab">Saving</span>
    </button>
    <button type="button" data-mode="control" role="tab" aria-selected="false" aria-label="Control and Automation">
      <span class="tab-ico tab-ctl" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.2 14.2h15.6l-.8 3.6H5z"/>
        <path d="M5.2 14.2 6.6 9.4h7.2L17.6 14"/>
        <path d="M8.2 9.4 9 7.2h4.4l1.2 2.2"/>
      </svg></span>
      <span class="tab-lab">Control</span>
    </button>
    <button type="button" data-mode="trips" role="tab" aria-selected="false" aria-label="Trips">
      <span class="tab-ico tab-trips" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></svg><i class="tab-dot" hidden></i></span>
      <span class="tab-lab">Trips</span>
    </button>
    <button type="button" data-mode="report" role="tab" aria-selected="false" aria-label="News">
      <span class="tab-ico tab-report" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 5.2h8.2A1.8 1.8 0 0 1 16.5 7v12.2H8.2A1.7 1.7 0 0 1 6.5 17.5V5.2Z"/><path d="M6.5 5.2A1.7 1.7 0 0 0 4.8 6.9v10.8A2.3 2.3 0 0 0 7.1 20h9.4"/><path d="M9.2 9.2h5.2M9.2 12.2h5.2M9.2 15.2h3.4"/></svg></span>
      <span class="tab-lab">News</span>
    </button>
    <button type="button" data-mode="daily" role="tab" aria-selected="false" aria-label="Report">
      <span class="tab-ico tab-daily" aria-hidden="true"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.6" width="14" height="16" rx="2.2"/><path d="M9.2 3.4h5.6v2.6H9.2z"/><path d="m8.4 11.2 1.4 1.4 2.4-2.6M8.4 16.2l1.4 1.4 2.4-2.6M14 11.4h2.2M14 16.4h2.2"/></svg></span>
      <span class="tab-lab">Report</span>
    </button>
  </nav>
</div>
<div id="sheet" class="sheet hidden"><div class="sheetbody" id="sheetbody"></div></div>
<script src="maplibre-gl.js"></script>
<script src="app.js?v=121"></script>
<script src="report.js?v=121"></script>
<script src="control.js?v=121"></script>
<script src="daily.js?v=121"></script>
<script src="summary.js?v=121"></script>
<script src="trips.js?v=121"></script>
</body>
</html>
